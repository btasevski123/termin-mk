services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: termin
      POSTGRES_PASSWORD: termin
      POSTGRES_DB: termin_mk
    ports:
      - "5435:5432"
    volumes:
      - termin_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U termin -d termin_mk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  termin_pg:
